name: Mettre à jour les recommandations mensuelles

on:
  schedule:
    - cron: '0 3 1 * *' # Le 1er de chaque mois à 03:00 UTC
  workflow_dispatch: # Permet de le lancer manuellement à la demande

jobs:
  update-recs:
    runs-on: ubuntu-latest
    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Restauration automatique du fichier cache des commandes d'une exécution à l'autre
      - name: Restaure orders cache
        uses: actions/cache@v4
        with:
          path: orders_cache.json
          key: orders-cache-${{ github.run_id }}
          restore-keys: |
            orders-cache-

      - name: Install dependencies
        run: pip install requests woocommerce

      - name: Run script
        env:
          WOO_URL: ${{ secrets.WOO_URL }}
          WOO_CLIENT: ${{ secrets.WOO_CLIENT }}
          WOO_SECRET: ${{ secrets.WOO_SECRET }}
          RECS_API_TOKEN: ${{ secrets.RECS_API_TOKEN }}
        run: python scripts/generate_recommendations.py
